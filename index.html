<!DOCTYPE html>
<!-- Ustawiamy domyślny język atrybutem lang -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adrian Paś - Portfolio</title>

    <!-- Importujemy stylizację z osobnego pliku -->
    <link rel="stylesheet" href="style.css">

    <!-- Biblioteki Three.js oraz GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<!-- Domyślnie ładujemy stronę z klasą lang-en -->
<body class="lang-en">

    <header>
        <!-- --- PRZYCISKI JĘZYKOWE --- -->
        <div class="lang-switch">
            <button class="lang-btn active" id="btn-en">EN</button>
            <button class="lang-btn" id="btn-pl">PL</button>
        </div>

        <h1>Adrian Paś</h1>
        <!-- Przykład tłumaczenia w nagłówku -->
        <p class="lang-en">My Projects & Portfolio</p>
        <p class="lang-pl">Moje projekty i portfolio</p>
    </header>

    <main>
        <!-- Tu JavaScript wczyta pliki HTML z folderu /projects -->
        <div id="projects-container"></div>
    </main>

    <!-- Importujemy logikę z osobnego pliku -->
    <script src="script.js"></script>

</body>
</html>
