<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adrian Paś - Portfolio</title>

    <!-- Biblioteki Three.js oraz GLTFLoader (dla plików .glb z kolorami) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 40px; background-color: #0d1117; color: #c9d1d9; }
        header { text-align: center; margin-bottom: 60px; }
        h1 { color: #58a6ff; }
        .project { display: flex; flex-wrap: wrap; gap: 30px; margin-bottom: 50px; background: #161b22; padding: 20px; border-radius: 8px; align-items: center; }
        
        .model-container { 
            width: 100%; 
            max-width: 400px; 
            height: 300px; 
            background-color: #0d1117; 
            border-radius: 6px; 
            overflow: hidden;
            cursor: grab;
        }
        .model-container:active { cursor: grabbing; }

        .project-info { flex: 1; min-width: 280px; }
        .tech-stack span { background: #21262d; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-right: 5px; color: #8b949e; }
        a.btn { display: inline-block; margin-top: 15px; padding: 8px 16px; background: #238636; color: white; text-decoration: none; border-radius: 6px; }
    </style>
</head>
<body>

    <header>
        <h1>Adrian Paś</h1>
        <p>Pasjonat programowania | Moje projekty i portfolio</p>
    </header>

    <main>
        <section class="project">
            <div id="robot-3d-viewer" class="model-container"></div>

            <div class="project-info">
                <h2>3D printed 6 axis robotic arm</h2>
                <p>Krótki opis tego, co robi aplikacja, jaki problem rozwiązuje i czego się przy niej nauczyłeś.</p>
                <div class="tech-stack">
                    <span>C++ / STM32</span><span>Python</span><span>3D Printing / CAD</span>
                </div>
                <br>
                <a href="https://github.com/pasadrian/6-axis-robot-arm" class="btn" target="_blank">Zobacz kod i modele 3D na GitHubie</a>
            </div>
        </section>
    </main>

    <script>
        const container = document.getElementById('robot-3d-viewer');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- 1. OŚWIETLENIE BEZCIENIOWE (Z KAŻDEJ STRONY) ---
        // Światło z nieba i ziemi – eliminuje czarne cienie od dołu i z boku
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2.5);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        // Światło mocne wprost z pozycji kamery
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(1, 1, 2);
        scene.add(dirLight);

        // --- 2. ŁADOWANIE MODELU I POPRAWKA MATERIAŁÓW ---
        const loader = new THREE.GLTFLoader();
        
        loader.load('ramie_robota.glb', function (gltf) {
            const model = gltf.scene;

            // Wymuszenie matowego plastiku i usunięcie sztucznych czarnych odbić
            model.traverse((child) => {
                if (child.isMesh && child.material) {
                    child.material.metalness = 0.1; // Wyłączenie odbić metalicznych
                    child.material.roughness = 0.6; // Matowy plastik zamiast błyszczącego
                }
            });

            // Wyśrodkowanie modelu
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            model.position.x += (model.position.x - center.x);
            model.position.y += (model.position.y - center.y);
            model.position.z += (model.position.z - center.z);

            scene.add(model);

            // --- 3. USTAWIENIE KAMERY BARDZIEJ Z BOKU I BLIŻEJ ---
            const maxDim = Math.max(size.x, size.y, size.z);
            
            // Kamera bliżej (1.0 zamiast 1.5) oraz na wysokości środka modelu
            camera.position.set(maxDim * 1.1, maxDim * 0.3, maxDim * 0.8);
            controls.target.set(0, 0, 0);
            controls.update();

            function animate() {
                requestAnimationFrame(animate);
                
                // Światło podąża za kamerą – model jest zawsze idealnie doświetlony z przodu
                dirLight.position.copy(camera.position);
                
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        }, undefined, function (error) {
            console.error('Błąd ładowania pliku 3D:', error);
        });

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
