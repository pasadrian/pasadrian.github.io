<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adrian Paś - Portfolio</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 40px; background-color: #0d1117; color: #c9d1d9; }
        header { text-align: center; margin-bottom: 60px; }
        h1 { color: #58a6ff; }
        .project { display: flex; flex-wrap: wrap; gap: 30px; margin-bottom: 50px; background: #161b22; padding: 20px; border-radius: 8px; }
        .project img { width: 100%; max-width: 400px; border-radius: 6px; object-fit: cover; }
        .project-info { flex: 1; min-width: 280px; }
        .tech-stack span { background: #21262d; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-right: 5px; color: #8b949e; }
        a.btn { display: inline-block; margin-top: 15px; padding: 8px 16px; background: #238636; color: white; text-decoration: none; border-radius: 6px; }
    </style>
</head>
<body>

    <header>
        <h1>Adrian Paś</h1>
        <p>Pasjonat programowania | Moje projekty i portfolio</p>
    </header>

    <main>
        <!-- PROJEKT 1 -->
        <section class="project">
            <img src="https://via.placeholder.com/400x250" alt="Podgląd projektu">
            <div class="project-info">
                <h2>Nazwa Projektu 1</h2>
                <p>Krótki opis tego, co robi aplikacja, jaki problem rozwiązuje i czego się przy niej nauczyłeś.</p>
                <div class="tech-stack">
                    <span>HTML</span><span>CSS</span><span>JavaScript</span>
                </div>
                <br>
                <a href="LINK_DO_REPOZYTORIUM" class="btn" target="_blank">Zobacz na GitHubie</a>
            </div>
        </section>

        <!-- PROJEKT 2 -->
        <!-- Tutaj wklejasz kolejny blok .project -->
    </main>

</body>
</html>
